name: Probe dependency versions

on:
  push:
    paths:
      - .github/workflows/probe-versions.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print latest versions from Google and Mozilla Maven
        run: |
          latest() {
            local repo="$1" path="$2"
            local xml
            xml=$(curl -fsSL "$repo/$path/maven-metadata.xml" || echo "")
            echo "== $path"
            echo "$xml" | grep -oE '<version>[^<]+' | sed 's/<version>//' | tail -n 12 | tr '\n' ' '
            echo
          }
          G=https://dl.google.com/dl/android/maven2
          M=https://maven.mozilla.org/maven2
          curl -fsSL $M/org/mozilla/geckoview/geckoview/maven-metadata.xml | grep -oE '<(latest|release)>[^<]+' || true
          echo "== geckoview 15x/16x versions"
          curl -fsSL $M/org/mozilla/geckoview/geckoview/maven-metadata.xml | grep -oE '<version>1[5-9][0-9]\.[^<]+' | sed 's/<version>//' | sort -V | tail -n 8
          echo "== AGP 9.x stable"
          curl -fsSL $G/com/android/tools/build/gradle/maven-metadata.xml | grep -oE '<version>9\.[0-9]+\.[0-9]+<' | sort -V | tail -n 6
          echo "== cast-framework 23.0.0 pom"
          curl -fsSL $G/com/google/android/gms/play-services-cast-framework/23.0.0/play-services-cast-framework-23.0.0.pom | grep -A2 '<artifactId>' | grep -oE '<(artifactId|version)>[^<]+' | tr '\n' ' '
          echo
          echo "== cast 23.0.0 pom"
          curl -fsSL $G/com/google/android/gms/play-services-cast/23.0.0/play-services-cast-23.0.0.pom | grep -oE '<(artifactId|version|minSdkVersion)>[^<]+' | tr '\n' ' '
          echo
      - name: Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          java -version
