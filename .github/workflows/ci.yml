name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Detector extension tests (Node)
        run: node --test detection/src/test/js/

      - name: Unit tests and debug build
        run: ./gradlew :core:test :proxy:test testDebugUnitTest assembleDebug --continue --stacktrace

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: snapcast-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore
