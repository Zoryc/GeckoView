name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Detector extension tests (Node)
        run: node --test 'detection/src/test/js/**/*.test.js'

      - name: Unit tests and debug build
        run: |
          set -o pipefail
          ./gradlew :core:test :proxy:test testDebugUnitTest assembleDebug --continue 2>&1 | tee build.log

      - name: Summarize build errors
        if: failure()
        run: |
          echo "::group::Compiler errors"
          grep -E '^e: ' build.log | sort -u | head -n 300 || true
          echo "::endgroup::"
          echo "::group::Failed tasks and causes"
          grep -E -A12 '^\* What went wrong' build.log | head -n 400 || true
          echo "::endgroup::"
          echo "::group::Failed tests"
          grep -E 'FAILED$|Test.*FAILED' build.log | head -n 100 || true
          echo "::endgroup::"

      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: snapcast-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Release build (minified, signed with the debug key)
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee release.log

      - name: Summarize release build errors
        if: failure()
        run: |
          grep -E '^e: |^ERROR|R8|Missing class' release.log | sort -u | head -n 200 || true
          grep -E -A12 '^\* What went wrong' release.log | head -n 200 || true

      - name: Upload release APK (arm64-v8a, most phones)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: snapcast-release-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          retention-days: 30
          compression-level: 0

      - name: Upload release APKs (other ABIs)
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: snapcast-release-other-abis
          path: |
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            app/build/outputs/apk/release/app-x86_64-release.apk
          retention-days: 30
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore
