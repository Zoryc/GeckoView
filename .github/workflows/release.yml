name: Release

# Pushing a tag like v0.1 builds the release APKs and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SNAPCAST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SNAPCAST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SNAPCAST_KEYSTORE_BASE64 is not set; the release is signed with a temporary debug key."
          fi

      - name: Build release APKs
        env:
          SNAPCAST_KEYSTORE_PASSWORD: ${{ secrets.SNAPCAST_KEYSTORE_PASSWORD }}
          SNAPCAST_KEY_ALIAS: ${{ secrets.SNAPCAST_KEY_ALIAS }}
          SNAPCAST_KEY_PASSWORD: ${{ secrets.SNAPCAST_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Name the APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/snapcast-${version}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Snapcast ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --prerelease
