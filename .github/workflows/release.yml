name: Release

# Pushing a tag like v0.1 builds the release APKs and publishes them as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Name the APKs
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/snapcast-${version}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Snapcast ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md \
            --prerelease
