name: Release

# Builds the release APKs and publishes them as a GitHub release. Run it from the Actions tab with a
# version number (it creates the vX.Y tag on the selected branch), or push a vX.Y tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the "v" (e.g. 0.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SNAPCAST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SNAPCAST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::SNAPCAST_KEYSTORE_BASE64 is not set; the release is signed with a temporary debug key."
          fi

      - name: Build release APKs
        env:
          SNAPCAST_KEYSTORE_PASSWORD: ${{ secrets.SNAPCAST_KEYSTORE_PASSWORD }}
          SNAPCAST_KEY_ALIAS: ${{ secrets.SNAPCAST_KEY_ALIAS }}
          SNAPCAST_KEY_PASSWORD: ${{ secrets.SNAPCAST_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Resolve the tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Name the APKs
        run: |
          version="${TAG#v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/snapcast-${version}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          # R8's mapping turns the obfuscated stack traces of this release (in reports) back into names.
          cp app/build/outputs/mapping/release/mapping.txt "dist/snapcast-${version}-mapping.txt"
          ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release created in the GitHub UI: attach the APKs to it.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Snapcast $TAG" \
              --notes-file .github/release-notes.md \
              --prerelease
          fi
